<div id="esp32nut-memory-chart" style="color:var(--foreground);font:14px system-ui,sans-serif">
  <style>
    #esp32nut-memory-chart{max-width:920px;margin:auto}#esp32nut-memory-chart svg{width:100%;height:auto;display:block;margin:18px 0 30px}#esp32nut-memory-chart .grid{stroke:var(--border);stroke-width:1}#esp32nut-memory-chart .axis{fill:var(--foreground);font-size:12px}#esp32nut-memory-chart .title{fill:var(--foreground);font-size:16px;font-weight:700}#esp32nut-memory-chart .bar{fill:var(--viz-series-1)}#esp32nut-memory-chart .bar2{fill:var(--viz-series-2)}#esp32nut-memory-chart .bar3{fill:var(--viz-series-3)}#esp32nut-memory-chart .value{fill:var(--foreground);font-size:12px;font-weight:650}#esp32nut-memory-chart .note{fill:var(--foreground);font-size:11px}
  </style>
  <svg viewBox="0 0 900 310" role="img" aria-label="Flash storage bars in kilobytes">
    <text x="64" y="20" class="title">Non-volatile flash storage (KB)</text>
    <rect x="64" y="38" width="790" height="210" fill="none" class="grid"/>
    <g class="grid"><line x1="64" y1="248" x2="854" y2="248"/><line x1="64" y1="196" x2="854" y2="196"/><line x1="64" y1="144" x2="854" y2="144"/><line x1="64" y1="92" x2="854" y2="92"/><line x1="64" y1="38" x2="854" y2="38"/></g>
    <g class="axis"><text x="52" y="252" text-anchor="end">0</text><text x="52" y="200" text-anchor="end">4,096</text><text x="52" y="148" text-anchor="end">8,192</text><text x="52" y="96" text-anchor="end">12,288</text><text x="52" y="42" text-anchor="end">16,384</text><text x="18" y="146" transform="rotate(-90 18 146)">Amount (KB)</text></g>
    <rect x="135" y="38" width="120" height="210" class="bar"/><rect x="365" y="143" width="120" height="105" class="bar2"/><rect x="595" y="206" width="120" height="42" class="bar3"/>
    <g class="value"><text x="195" y="32" text-anchor="middle">16,384</text><text x="425" y="137" text-anchor="middle">8,192</text><text x="655" y="200" text-anchor="middle">3,264 each</text></g>
    <g class="axis"><text x="195" y="270" text-anchor="middle">Physical flash</text><text x="425" y="270" text-anchor="middle">Partitioned range</text><text x="655" y="270" text-anchor="middle">OTA app slot</text></g>
    <text x="64" y="300" class="note">Two OTA app slots exist; each is 3,264 KB. The 8,192 KB partitioned range includes both slots, FAT data, NVS, and coredump.</text>
  </svg>
  <svg viewBox="0 0 900 330" role="img" aria-label="Available runtime memory and request allocations in kilobytes">
    <text x="64" y="20" class="title">Runtime RAM: example free memory and known request buffers (KB)</text>
    <rect x="64" y="38" width="790" height="210" fill="none" class="grid"/>
    <g class="grid"><line x1="64" y1="248" x2="854" y2="248"/><line x1="64" y1="196" x2="854" y2="196"/><line x1="64" y1="144" x2="854" y2="144"/><line x1="64" y1="92" x2="854" y2="92"/><line x1="64" y1="38" x2="854" y2="38"/></g>
    <g class="axis"><text x="52" y="252" text-anchor="end">0</text><text x="52" y="200" text-anchor="end">2,048</text><text x="52" y="148" text-anchor="end">4,096</text><text x="52" y="96" text-anchor="end">6,144</text><text x="52" y="42" text-anchor="end">8,192</text><text x="18" y="146" transform="rotate(-90 18 146)">Amount (KB)</text></g>
    <rect x="112" y="244" width="100" height="4" class="bar3"/><rect x="275" y="38" width="100" height="210" class="bar"/><rect x="438" y="247" width="100" height="1" class="bar2"/><rect x="601" y="247" width="100" height="1" class="bar2"/><rect x="764" y="247" width="70" height="1" class="bar2"/>
    <g class="value"><text x="162" y="238" text-anchor="middle">150</text><text x="325" y="32" text-anchor="middle">8,192</text><text x="488" y="238" text-anchor="middle">48</text><text x="651" y="238" text-anchor="middle">7</text><text x="799" y="238" text-anchor="middle">~5.1</text></g>
    <g class="axis"><text x="162" y="270" text-anchor="middle">Free internal</text><text x="325" y="270" text-anchor="middle">Free PSRAM</text><text x="488" y="270" text-anchor="middle">Admin page</text><text x="651" y="270" text-anchor="middle">Status buffer</text><text x="799" y="270" text-anchor="middle">Full-log copy</text></g>
    <text x="64" y="298" class="note">150 KB and 8,192 KB are the supplied screen's live snapshot; they will vary. Tiny buffer bars are labeled because this shared scale makes them hard to see.</text>
    <text x="64" y="316" class="note">The 48 KB page and 7 KB status response are confirmed limits. Full-log copy is approximately 24 × 216 bytes, before stack/TLS overhead.</text>
  </svg>
</div>
